<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容页 — Baseline</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #222; line-height: 1.6; }
  .bar { padding: 10px 14px; border-bottom: 1px solid #eee; font-weight: bold; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; }
  h2 { font-size: 19px; margin-top: 20px; }
  pre { background: #f5f5f5; padding: 12px; overflow-x: auto; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
</style>
</head>
<body>
  <div class="bar">设计周刊</div>
  <main>
    <h1>响应式设计中的可读性工程</h1>
    <p style="color:#888;font-size:13px;">2026-08-11</p>
    <p>可读性不是字体大小的附属品，而是排版、间距、行宽与断点共同作用的结果。</p>
    <h2>设计原则</h2>
    <p>行宽控制、层级分明、溢出治理。</p>
    <h2>代码示例</h2>
    <pre>h1 { font-size: clamp(26px, 4vw, 38px); }</pre>
    <h2>对比表格</h2>
    <table>
      <tr><th>断点</th><th>布局</th></tr>
      <tr><td>320–767</td><td>单栏</td></tr>
      <tr><td>≥ 1200</td><td>双栏</td></tr>
    </table>
  </main>
</body>
</html>
