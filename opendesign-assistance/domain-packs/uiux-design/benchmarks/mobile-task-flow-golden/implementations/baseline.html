<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单追踪 — Baseline</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #222; }
  .bar { background: #eee; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
  .bar h1 { font-size: 16px; margin: 0; flex: 1; }
  main { padding: 14px; max-width: 480px; margin: 0 auto; }
  .status { margin: 12px 0; }
  .status p { margin: 6px 0; font-size: 14px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
  .chat { margin: 12px 0; }
  .chat div { background: #f4f4f4; border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 14px; }
  input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 8px 14px; background: #007bff; color: #fff; border: none; border-radius: 6px; }
</style>
</head>
<body>
  <div class="bar"><h1>订单追踪</h1><span>客</span></div>
  <main>
    <div class="status">
      <p>已下单 07-30</p>
      <p>已发货 07-31</p>
      <p><b>运输中（当前）</b></p>
      <p>已送达</p>
    </div>
    <div class="card">
      <b>订单 #OD-2026-0811</b>
      <p>¥1,280.00 ｜ 顺丰</p>
    </div>
    <div class="chat">
      <div>您好，您的订单正在运输中。</div>
      <div>能帮我改地址吗？</div>
      <div>已为您记录。</div>
      <input type="text" placeholder="输入消息">
      <button type="button">发送</button>
    </div>
  </main>
</body>
</html>
