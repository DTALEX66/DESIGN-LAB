# Single product Node workspace: only the Workbench is a workspace package.
# The MiniGame fixture (fixtures/domains/game-visual) keeps its OWN node_modules
# and is deliberately NOT a workspace dependency (taskpack 24: "不把它变成
# workspace dependency"). No npm/yarn truth coexists here.
packages:
  - "apps/workbench"
# esbuild is a required Vite dependency that postinstalls a native binary.
# Approving its build script is a supply-chain decision recorded here (pinned in
# the lockfile, MIT). No other dependency in this workspace runs build scripts.
allowBuilds:
  esbuild: true
