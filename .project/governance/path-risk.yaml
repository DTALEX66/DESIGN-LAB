schemaVersion: design-lab/path-risk/v1
rules:
  - path: .project-local/
    risk: ignored
    reason: Runtime data, not tracked
  - path: .hermes/
    risk: quarantine
    reason: Legacy runtime, migrating to .project-local
  - path: .venv/
    risk: ignored
    reason: Local virtualenv, not tracked (regenerable)
  - path: research/candidates/
    risk: low
    reason: CONDITIONAL_POC index only (README + source registry); full third-party source lives in ignored .project-local/cache/vendor
  - path: fixtures/domains/game-visual/
    risk: medium
    reason: Should be fixture, not product line
  - path: docs/
    risk: medium
    reason: Should be docs, not memory
