schemaVersion: design-lab/path-risk/v1
rules:
  - path: .project-local/
    risk: ignored
    reason: Runtime data, not tracked
  - path: .hermes/
    risk: quarantine
    reason: Legacy runtime, migrating to .project-local
  - path: design-lab/intelligence/
    risk: high
    reason: Contains full third-party repos, must qualify or remove
  - path: design-lab/knowledge/
    risk: high
    reason: Contains full third-party repos, must qualify or remove
  - path: fixtures/domains/game-visual/
    risk: medium
    reason: Should be fixture, not product line
  - path: docs/
    risk: medium
    reason: Should be docs, not memory
