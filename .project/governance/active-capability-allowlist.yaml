schemaVersion: design-lab/active-capability-allowlist/v1
description: Only DESIGN-owned, qualified capabilities may appear in tool discovery
allowlist:
  - id: reconstruction
    path: packages/capabilities/reconstruction
    status: qualified
    evidence_level: E2
  - id: design-ir-v2
    path: design-lab/schemas/design-ir-v2.schema.json
    status: qualified
    evidence_level: E1
  - id: capability-manifest
    path: design-lab/schemas/capability-manifest.schema.json
    status: qualified
    evidence_level: E1
  - id: open-design-adapter
    path: integrations/hosts/open-design
    status: qualified
    evidence_level: E2
  - id: comfyui-adapter
    path: integrations/generators/comfyui
    status: declared
    evidence_level: E0
  - id: adobe-adapter
    path: design-lab/adapters/creative-tools/adobe
    status: declared
    evidence_level: E0
  - id: minimax-h3-adapter
    path: integrations/generators/minimax-h3
    status: declared
    evidence_level: E0
  - id: mcp-adapter
    path: integrations/mcp
    status: declared
    evidence_level: E0
