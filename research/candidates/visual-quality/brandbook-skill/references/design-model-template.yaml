# design-model.yaml — Single Source of Truth for a generated brand system.
# Every other artifact (brandbook.html, landing-page.html) is generated FROM this file.
# Iteration rule: edit THIS file first, then re-render / regenerate affected artifacts.
#
# Two provenance values appear throughout:
#   source: observed  → measured from the real brand (URL / screenshot / codebase)
#   source: derived   → invented by the assistant, must cite which principle justifies it

name: "Aster"                    # brand name, kebab-cased for folder: aster-brand
analyzed_from: "https://aster.ink"   # url | "screenshots" | "description" | "codebase"
analyzed_on: "2026-07-18"
philosophy: >-                   # 2-4 sentences. Attitude + lineage + the primary tension.
  A quiet reading room for research. Warm paper, ink text, one plum accent.
  Tension: scholarly calm vs. the urgency of a deadline.
primary_mode: "light"            # light | dark
brand_domain: "research notes / citation management"
brand_type: "ui-rich"            # ui-rich | content-rich | spectacle-led  (changes landing-page strategy)
ownership: "third-party"         # own | third-party — third-party output is for study/internal reference
mono_for_code: true
mono_for_metrics: false

# ── PRIMITIVES ──────────────────────────────────────────────
# Raw ramps. Trim radii/spacing to values the brand ACTUALLY uses — an unused
# primitive is a sign of over-sampling.
primitives:
  colors:
    neutral:                     # temperature must match the brand: warm / cool / pure
      50: "#FAF8F5"
      100: "#F3F0EA"
      200: "#E6E1D8"
      300: "#D4CEC2"
      400: "#A8A193"
      500: "#7E776A"
      600: "#5F594E"
      700: "#48433A"
      800: "#322E27"
      900: "#211E19"
      950: "#14120E"
    brand:                       # accent hue; 500 = the observed primary
      50: "#FBF1F7"
      100: "#F6E0EC"
      300: "#DA97BE"
      500: "#8E3D6E"
      700: "#5E2649"
      900: "#321326"
    red:   { 50: "#FEF2F2", 500: "#E5484D", 900: "#7F1D1D" }
    green: { 50: "#F0FDF4", 500: "#4AB66A", 900: "#14532D" }
    amber: { 50: "#FFFBEB", 500: "#E5A73B", 900: "#78350F" }
  spacing: [0, 4, 8, 12, 16, 24, 32, 48, 64, 96]
  radii: [0, 4, 6, 8, 12, 999]   # ONLY values the brand uses

# ── SEMANTIC TOKENS ─────────────────────────────────────────
tokens:
  colors:
    light:
      background: "{neutral.50}"
      surface1: "{neutral.100}"
      surface2: "{neutral.200}"
      border: "{neutral.200}"
      border_visible: "{neutral.300}"
      text1: "{neutral.900}"
      text2: "{neutral.600}"
      text3: "{neutral.500}"
      accent: "{brand.500}"
      accent_subtle: "{brand.50}"
      on_accent: "#FFFFFF"
    dark:                        # derive, don't invert. Warm light mode → warm dark mode.
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "{neutral.800}"
      border: "{neutral.800}"
      border_visible: "{neutral.700}"
      text1: "{neutral.50}"
      text2: "{neutral.400}"
      text3: "{neutral.500}"
      accent: "{brand.300}"
      accent_subtle: "{brand.900}"
      on_accent: "#1A1A1A"
    success: "{green.500}"
    warning: "{amber.500}"
    error: "{red.500}"

  spacing: { xs: 4, sm: 8, md: 16, lg: 24, xl: 32, 2xl: 48, 3xl: 64 }

  radii:
    control: 6                   # buttons, inputs
    component: 8                 # cards, panels
    container: 12                # modals, sheets
    pill: 999                    # only if the brand uses pills

  typography:
    # google_fonts: families to load, exactly as on fonts.googleapis.com
    google_fonts: ["Spectral:wght@400;500", "Hanken Grotesk:wght@400;500;600", "IBM Plex Mono:wght@400"]
    display: { family: "Spectral", weight: 500, why: "scholarly serif matches the reading-room attitude" }
    body:    { family: "Hanken Grotesk", weight: 400, why: "humanist sans, warm counters" }
    mono:    { family: "IBM Plex Mono", weight: 400 }
    scale:                       # canonical 7-token scale; sizes in px
      display:    { size: 40, line_height: 1.1,  letter_spacing: "-0.02em", weight: 500 }
      heading:    { size: 24, line_height: 1.2,  letter_spacing: "-0.01em", weight: 500 }
      subheading: { size: 18, line_height: 1.35, letter_spacing: "0",       weight: 500 }
      body:       { size: 15, line_height: 1.55, letter_spacing: "0",       weight: 400 }
      body_sm:    { size: 13, line_height: 1.5,  letter_spacing: "0",       weight: 400 }
      caption:    { size: 12, line_height: 1.4,  letter_spacing: "0.01em",  weight: 400 }
      label:      { size: 11, line_height: 1.2,  letter_spacing: "0.08em",  weight: 600 }  # usually uppercase

  elevation:
    strategy: "subtle"           # flat | subtle | glow | material
    shadow: "0 1px 3px rgba(20,18,14,.07)"

  motion:
    personality: "smooth"        # mechanical | smooth | playful | none
    easing: "ease-in-out"
    duration: "220ms"

# ── BRAND LAYER ─────────────────────────────────────────────
# The blocks hue doesn't have. This is what makes it a brand system, not a UI kit.
brand:
  logo:
    treatment: "wordmark"        # wordmark | monogram | symbol | combination
    rendering: >-                # how the renderer should draw the placeholder logo
      Brand name set in the display face, weight 500, tight tracking.
    clearspace: "1× cap-height on all sides"
    min_size: "24px height digital / 8mm print"
    misuse:                      # each becomes a crossed-out don't tile in the brandbook
      - "Never stretch or condense"
      - "Never set on a low-contrast photographic background"
      - "Never add shadows or outlines"

  voice:
    adjectives: ["scholarly", "warm", "precise"]
    principles:
      - "Write like a well-read colleague, not a marketing department."
      - "Specifics over superlatives: name the exact feature, never say 'powerful'."
    examples:                    # rendered as do/don't copy pairs
      - do: "Find a citation from three years ago by remembering one word of it."
        dont: "Powerful search features for all your research needs."
      - do: "Your library, readable at 2 a.m."
        dont: "A revolutionary knowledge management experience."

  imagery:
    direction: >-                # prose spec — this section is a SPEC, not generated photos
      Natural light, warm undertones, paper and desk textures. Photography feels
      found, not staged. No white-background product shots, no stock smiles.
    treatments:                  # renderer demos each on a placeholder field, CSS only
      - { name: "warm-duotone", css: "duotone" , tint: "{brand.500}", base: "{neutral.200}" }
      - { name: "film-grain",   css: "grain" }
      - { name: "soft-crop",    css: "rounded", radius: "{radii.container}" }
    aspect_ratios: ["3:2 editorial", "1:1 avatars", "16:9 heroes"]
    dos:
      - "Warm ambient light, shallow depth of field"
      - "Objects mid-use: an open book, a cooling coffee"
    donts:
      - "Blue-tinted office stock photography"
      - "AI-generated faces"
      - "Full-bleed neon gradients"

  iconography:
    observed_style: "~1.75px outline, rounded terminals, humanist"
    fallback_kit:
      name: "Phosphor"           # never claim the brand uses this kit
      weight: "regular"
      cdn: "https://unpkg.com/@phosphor-icons/web@2/src/regular/style.css"
      match_reasoning: "Matches stroke weight and rounded terminals; Iconoir second choice."

# ── COMPONENTS ──────────────────────────────────────────────
# Only components with a Tear-Down Sheet (observed) or Derived Design (derived + justification).
components:
  button_primary:
    source: "observed"
    background: "{tokens.accent}"
    color: "{tokens.on_accent}"
    padding: "10px 16px"
    radius: "{radii.control}"
    font_weight: 500
  button_secondary:
    source: "observed"
    background: "transparent"
    color: "{tokens.text1}"
    border: "1px solid {tokens.border_visible}"
    padding: "10px 16px"
    radius: "{radii.control}"
    font_weight: 500
  input:
    source: "derived"
    justification: "No visible forms on site; follows control radius + border_visible per principle 2."
    background: "{tokens.background}"
    border: "1px solid {tokens.border_visible}"
    padding: "10px 14px"
    radius: "{radii.control}"
  card:
    source: "observed"
    background: "{tokens.surface1}"
    border: "1px solid {tokens.border}"
    padding: "24px"
    radius: "{radii.component}"
  badge:
    source: "derived"
    justification: "Derived from tag styles in blog; pill only because primitives include 999."
    background: "{tokens.accent_subtle}"
    color: "{tokens.accent}"
    padding: "3px 10px"
    radius: "{radii.pill}"
    font_size: 12

# ── APPLICATIONS ────────────────────────────────────────────
# Content seeds for the renderer's application mockups (pure HTML/CSS, no images).
# Copy must be written in the brand voice — no lorem ipsum, ever.
applications:
  social_card:                   # 1:1 social tile
    headline: "Read wider. Cite faster."
    sub: "Aster keeps every source one keystroke away."
  slide_cover:                   # 16:9 deck cover
    kicker: "ASTER · RESEARCH BRIEFING"
    headline: "The state of citation, 2026"
    presenter: "Research Team"
  email_header:                  # 600px email masthead
    preheader: "Monthly digest"
    headline: "Three papers worth your Sunday"

# ── ANTI-PATTERNS ───────────────────────────────────────────
# 6-10 falsifiable bans. These are the immune system against generic output.
anti_patterns:
  - "No full-bleed gradients — gradients only as small accents, never page backgrounds"
  - "No border-radius above 12px except pills"
  - "No pure black #000 text — ink is {neutral.900}"
  - "No more than 2 chromatic colors per screen"
  - "No drop shadows deeper than the subtle strategy shadow"
  - "No Inter as a display face"
