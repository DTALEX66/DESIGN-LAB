name: Release Gate (DL-CI-006)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Fail-closed release qualification (runtime evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact target tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        run: python -m pip install -r requirements.txt

      - name: Run canonical structural verification (exact checkout SHA)
        run: python design-lab/scripts/verify_design_lab.py

      - name: Check capability evidence floors
        run: python design-lab/scripts/verify_capability_evidence_v4.py

      - name: Run fail-closed release gate (preconditions, human acceptance, cards)
        run: python design-lab/scripts/verify_release_gate.py

      # DL-CI-006: release evidence is generated at runtime, never required as a
      # pre-committed file. The attestation carries the exact checkout SHA and is
      # uploaded as an Actions Artifact; a committed file can only ever prove a
      # PRIOR commit (DL-EVD-002 forbids self-reference).
      - name: Generate runtime Evidence Attestation (exact SHA)
        run: |
          python design-lab/scripts/update_evidence_binding.py --attestation
          test -f .hermes/task-runtime/evidence/attestation-*.json
          ATTR=$(ls .hermes/task-runtime/evidence/attestation-*.json | head -1)
          SUBJECT=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['subjectCommitSha'])" "$ATTR")
          echo "attestation subject=$SUBJECT"
          test "$SUBJECT" = "${{ github.sha }}"
          sha256sum "$ATTR" design-lab/config/sbom-v42.spdx.json design-lab/config/capability-index.json > artifacts.sha256
          cat artifacts.sha256

      - name: Upload runtime evidence as Actions Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b7f698f8297e8f3f4f7e4b8c1a2 # v4
        with:
          name: dl-release-evidence-${{ github.sha }}
          path: |
            .hermes/task-runtime/evidence/attestation-*.json
            artifacts.sha256
          if-no-files-found: error

      # API readback: the attestation must match the exact run's head SHA
      # (github context is the API-backed checkout identity).
      - name: API readback consistency check
        run: |
          ATTR=$(ls .hermes/task-runtime/evidence/attestation-*.json | head -1)
          SUBJECT=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['subjectCommitSha'])" "$ATTR")
          echo "github.sha=${{ github.sha }}"
          echo "subject=$SUBJECT"
          test "$SUBJECT" = "${{ github.sha }}"
          echo "RELEASE_EVIDENCE_READBACK=OK"
