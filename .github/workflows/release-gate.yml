name: Release Gate (DL-CI-004)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Fail-closed release qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact target tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        run: python -m pip install -r requirements.txt

      - name: Run canonical structural verification
        run: python design-lab/scripts/verify_design_lab.py

      - name: Run fail-closed release gate
        run: python design-lab/scripts/verify_release_gate.py

      - name: Validate exact-SHA release evidence
        run: |
          test -f design-lab/config/release-evidence.json
          python design-lab/scripts/verify_release_evidence.py design-lab/config/release-evidence.json
