[project]
name = "design-lab"
version = "0.1.0-alpha.0"
description = "AI-native professional design intelligence and production layer"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
  "Pillow>=11.3,<13",
  "numpy>=2.2,<3",
  "scikit-image>=0.25,<0.27",
  "defusedxml>=0.7,<1",
]

[project.scripts]
design-lab = "design_lab.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design_lab"]

[tool.hatch.build.targets.wheel.force-include]
"design-lab/schemas/state" = "design_lab/resources/state"
"apps/workbench" = "design_lab/resources/workbench"
"integrations/hosts/adobe/illustrator/reconstruction-assemble.jsx" = "design_lab/resources/adobe/reconstruction-assemble.jsx"

[tool.hatch.build.targets.sdist]
only-include = ["src/design_lab", "design-lab/schemas/state", "apps/workbench", "integrations/hosts/adobe/illustrator/reconstruction-assemble.jsx", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["design-lab/tests"]
