[project]
name = "design-lab"
version = "0.1.0-alpha.0"
description = "AI-native professional design intelligence and production layer"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
  "Pillow>=11.3,<13",
  "numpy>=2.2,<3",
  "scikit-image>=0.25,<0.27",
  "defusedxml>=0.7,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["design-lab/tests"]
