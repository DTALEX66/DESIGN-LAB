[project]
name = "design-lab"
version = "0.1.0-alpha.0"
description = "AI-native professional design intelligence and production layer"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
  "Pillow>=11.3,<13",
  "numpy>=2.2,<3",
  "scikit-image>=0.25,<0.27",
  "defusedxml>=0.7,<1",
]

[project.scripts]
design-lab = "design_lab.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design_lab"]
exclude = ["src/design_lab/reconstruction/__init__.py"]

[tool.hatch.build.targets.wheel.force-include]
"packages/capabilities/reconstruction/__init__.py" = "design_lab/reconstruction/__init__.py"
"packages/capabilities/reconstruction/contracts.py" = "design_lab/reconstruction/contracts.py"
"packages/capabilities/reconstruction/adobe_job.py" = "design_lab/reconstruction/adobe_job.py"
"packages/capabilities/reconstruction/adobe_lowering.py" = "design_lab/reconstruction/adobe_lowering.py"
"design-lab/schemas/reconstruction/reconstruction-ir.schema.json" = "design_lab/resources/reconstruction/reconstruction-ir.schema.json"
"design-lab/schemas/reconstruction/reconstruction-run.schema.json" = "design_lab/resources/reconstruction/reconstruction-run.schema.json"
"design-lab/schemas/state" = "design_lab/resources/state"
# P1-1 (audit 2026-09-21): ship ONLY the three files the packaged service
# actually serves (src/design_lab/workbench.py ROUTES). The whole-directory
# force-include that replaced this line dragged the local node_modules
# (30MB / 251 files) into local wheel builds, so a wheel built on a dev
# machine diverged from the ~0.5MB wheel CI builds from a clean checkout.
"apps/workbench/index.html" = "design_lab/resources/workbench/index.html"
"apps/workbench/style.css" = "design_lab/resources/workbench/style.css"
"apps/workbench/build/main.js" = "design_lab/resources/workbench/build/main.js"
# The capability library reads four committed documents. Without them an
# installed wheel resolves REPO_ROOT to whatever sits three levels above
# site-packages and raises "capability library input missing", which the HTTP
# layer then reports as PROJECT_STORE_UNAVAILABLE -- a wrong diagnosis that
# points the user at their database.
"vendor/sources.lock.json" = "design_lab/resources/capability-library/vendor/sources.lock.json"
"vendor/sources.revisions.json" = "design_lab/resources/capability-library/vendor/sources.revisions.json"
"design-lab/readiness/model-radar.json" = "design_lab/resources/capability-library/design-lab/readiness/model-radar.json"
"research/candidates/CANDIDATE-TAXONOMY.json" = "design_lab/resources/capability-library/research/candidates/CANDIDATE-TAXONOMY.json"
# E-SLICE-01 design layer: the design-system catalog manifests that a direction
# may bind to (design_layer.catalog() resolves this packaged-first).
"design-lab/design-systems" = "design_lab/resources/design-systems"
# D09/D10 (batch 22): the three read paths an installed wheel could not serve.
# `PROJECT_ROOT` is parents[3] of src/design_lab/runtime/paths.py, which is the
# checkout in a source tree but `Lib/` once installed, so research and rights
# answered 500 and the domain-pack projection answered rootState MISSING -- all
# three were "the bytes are not here", not "the answer is no".
"design-lab/schemas/research-finding.schema.json" = "design_lab/resources/repo/design-lab/schemas/research-finding.schema.json"
"design-lab/schemas/contracts/rights-decision.schema.json" = "design_lab/resources/repo/design-lab/schemas/contracts/rights-decision.schema.json"
"design-lab/schemas/domain-pack.schema.json" = "design_lab/resources/repo/design-lab/schemas/domain-pack.schema.json"
"design-lab/domain-packs" = "design_lab/resources/repo/design-lab/domain-packs"
# Backend A/D (2026-10-22): the two read-back envelopes the desk and the task pages are validated
# against, plus the state vocabulary the task envelope copies its status words out of. All three are
# read through repo_resource; without these lines an installed wheel answers /api/projects and the
# task reads with a contract-file refusal instead of a verdict.
"design-lab/schemas/project-list-v1.schema.json" = "design_lab/resources/repo/design-lab/schemas/project-list-v1.schema.json"
"design-lab/schemas/task-readback-v1.schema.json" = "design_lab/resources/repo/design-lab/schemas/task-readback-v1.schema.json"
"design-lab/config/state-vocabularies.json" = "design_lab/resources/repo/design-lab/config/state-vocabularies.json"
# The projection reuses the repo's own checker so a pack it calls VALIDATES cannot be
# one CI would reject; shipping it keeps that guarantee in an installed wheel
# (without it every pack would report NOT_CHECKED).
"design-lab/scripts/verify_domain_pack_v2.py" = "design_lab/resources/repo/design-lab/scripts/verify_domain_pack_v2.py"
"integrations/hosts/adobe/illustrator/reconstruction-assemble.jsx" = "design_lab/resources/adobe/reconstruction-assemble.jsx"
"integrations/hosts/adobe/photoshop-reconstruction/legacy-assemble.jsx" = "design_lab/resources/adobe/photoshop-native-assemble.jsx"

[tool.hatch.build.targets.sdist]
# P1-1 (audit 2026-09-21): the sdist ships the same three served workbench
# files as the wheel (was the whole apps/workbench dir, which dragged the
# local node_modules into sdist builds too).
only-include = ["vendor/sources.lock.json", "vendor/sources.revisions.json", "design-lab/readiness/model-radar.json", "research/candidates/CANDIDATE-TAXONOMY.json", "src/design_lab", "design-lab/schemas/state", "design-lab/design-systems", "apps/workbench/index.html", "apps/workbench/style.css", "apps/workbench/build/main.js", "integrations/hosts/adobe/illustrator/reconstruction-assemble.jsx", "integrations/hosts/adobe/photoshop-reconstruction/legacy-assemble.jsx", "packages/capabilities/reconstruction/__init__.py", "packages/capabilities/reconstruction/contracts.py", "packages/capabilities/reconstruction/adobe_job.py", "packages/capabilities/reconstruction/adobe_lowering.py", "design-lab/schemas/reconstruction/reconstruction-ir.schema.json", "design-lab/schemas/reconstruction/reconstruction-run.schema.json", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["design-lab/tests"]

# DLDS-C030 / FU-06 (single Ruff fact): `[tool.ruff]` below is the AUTHORITATIVE
# Ruff configuration (select F+E9, line-length 100, target py311). Measured state
# as of this tree: ruff is NOT a locked/installed dependency (absent from uv.lock,
# no `.venv` module) and NO gate executes it (canonical-verify.yml / release-gate.yml
# have no ruff step; there is no "lint-tools runner"). So linting is CONFIGURED but
# NOT YET ENFORCED — the single fact this note and docs/architecture/LANGUAGE-POLICY.md
# both record (label CONFIGURED_NOT_ENFORCED), consistent with the deepseek closeout
# report. (The inventory report's older "not configured" phrasing is corrected under
# the report-truth work, not here.) The recorded
# style baseline (E4/E7, ~219 findings) is reported, not silently mass-rewritten.
# Enforcement rollout = a pinned CI ruff gate on F+E9 (a CI-batch change); it must be
# landed and verified in CI (where uv + network are available) after confirming F+E9
# passes clean. Until then, nothing in this repo claims a lint gate runs.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F = pyflakes real defects (unused imports, undefined names, dead variables);
# E9 = runtime error class. E4/E7 style findings are tracked as a baseline in
# .project-local/task-artifacts/audit-20260915/lint-baseline.json, not gated.
select = ["F", "E9"]
