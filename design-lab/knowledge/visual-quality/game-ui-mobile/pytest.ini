[pytest]
# Pytest configuration for game-ui-mobile-friendly-design

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=agents
    --cov=hooks
    --cov=tools
    --cov=skills
    --cov-report=html
    --cov-report=term-missing

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external resources)
    e2e: End-to-end tests (slowest, full workflow)
    slow: Slow tests that take more than 1 second
    agent: Tests related to agent system
    handler: Tests related to tool handlers
    hook: Tests related to hook system
    degradation: Tests related to degradation handling
    skill: Tests related to skill system

# Coverage options
[coverage:run]
source = .
omit =
    tests/*
    */__pycache__/*
    */site-packages/*
    */.venv/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
