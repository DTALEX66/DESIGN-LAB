<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Guide — {{APP_NAME}}</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      background: var(--color-background-secondary, #F9FAFB);
      color: var(--color-text-primary, #111827);
      line-height: 1.5;
      padding: var(--spacing-6, 24px);
    }
    .nav {
      display: flex;
      gap: var(--spacing-4, 16px);
      margin-bottom: var(--spacing-8, 32px);
      padding-bottom: var(--spacing-4, 16px);
      border-bottom: 1px solid var(--color-border, #E5E7EB);
    }
    .nav a {
      color: var(--color-primary, #3B82F6);
      text-decoration: none;
      font-weight: var(--font-weight-medium, 500);
    }
    .nav a:hover { text-decoration: underline; }
    h1 { font-size: var(--font-size-2xl, 24px); font-weight: var(--font-weight-bold, 700); margin-bottom: var(--spacing-2, 8px); }
    .meta { color: var(--color-text-secondary, #6B7280); font-size: var(--font-size-sm, 14px); margin-bottom: var(--spacing-8, 32px); }
    section { margin-bottom: var(--spacing-8, 32px); }
    h2 { font-size: var(--font-size-lg, 18px); font-weight: var(--font-weight-semibold, 600); margin-bottom: var(--spacing-4, 16px); }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--spacing-4, 16px);
    }
    .color-swatch {
      border-radius: var(--radius-md, 12px);
      overflow: hidden;
      box-shadow: var(--shadow-sm, 0 1px 2px rgba(0,0,0,0.05));
      background: var(--color-background, #fff);
    }
    .color-swatch__preview { height: 80px; }
    .color-swatch__info { padding: var(--spacing-3, 12px); font-size: var(--font-size-xs, 12px); }
    .color-swatch__name { font-weight: var(--font-weight-medium, 500); }
    .color-swatch__hex { color: var(--color-text-secondary, #6B7280); font-family: monospace; }
    .type-sample { margin-bottom: var(--spacing-4, 16px); }
    .type-sample__label { font-size: var(--font-size-xs, 12px); color: var(--color-text-secondary); margin-bottom: var(--spacing-1, 4px); }
    .spacing-row { display: flex; align-items: center; gap: var(--spacing-4, 16px); margin-bottom: var(--spacing-2, 8px); }
    .spacing-bar { background: var(--color-primary, #3B82F6); height: 24px; border-radius: 2px; }
    .radius-row { display: flex; gap: var(--spacing-4, 16px); flex-wrap: wrap; }
    .radius-box {
      width: 80px; height: 80px;
      background: var(--color-background, #fff);
      border: 2px solid var(--color-border, #E5E7EB);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--font-size-xs, 12px); color: var(--color-text-secondary);
    }
    .shadow-row { display: flex; gap: var(--spacing-6, 24px); flex-wrap: wrap; }
    .shadow-box {
      width: 120px; height: 80px;
      background: var(--color-background, #fff);
      border-radius: var(--radius-md, 12px);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--font-size-xs, 12px); color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="style-guide.html"><strong>Style Guide</strong></a>
    <a href="components.html">Components</a>
  </nav>

  <h1>{{APP_NAME}} — Style Guide</h1>
  <p class="meta">Platform: {{PLATFORM}} · Canvas: {{CANVAS}} · Source: {{SOURCE_FILE}}</p>

  <!-- Agent: 替换以下各 section 内容为从截图提取的真实 token -->

  <section>
    <h2>Colors</h2>
    <div class="color-grid">
      <!-- Agent: 为每个 semantic color 生成一个 .color-swatch -->
    </div>
  </section>

  <section>
    <h2>Typography</h2>
    <!-- Agent: 填充 Display / Title / Body / Caption / Button 样本 -->
    <div class="type-sample">
      <div class="type-sample__label">Display — {{FONT_DISPLAY_SPEC}}</div>
      <div style="font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold);">标题示例 Aa</div>
    </div>
    <div class="type-sample">
      <div class="type-sample__label">Body — {{FONT_BODY_SPEC}}</div>
      <div style="font-size: var(--font-size-base); font-weight: var(--font-weight-normal);">正文示例 — 设计系统从截图提取</div>
    </div>
  </section>

  <section>
    <h2>Spacing</h2>
    <!-- Agent: 填充 spacing token 可视化条 -->
  </section>

  <section>
    <h2>Border Radius</h2>
    <div class="radius-row">
      <!-- Agent: 每种 radius token 一个 box -->
    </div>
  </section>

  <section>
    <h2>Shadows</h2>
    <div class="shadow-row">
      <!-- Agent: 每种 shadow token 一个 box -->
    </div>
  </section>
</body>
</html>
