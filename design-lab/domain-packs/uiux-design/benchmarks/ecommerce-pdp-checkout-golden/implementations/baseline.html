<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品详情 — Baseline</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #222; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #eee; }
  .bar h1 { font-size: 16px; margin: 0; flex: 1; }
  main { padding: 14px; max-width: 520px; margin: 0 auto; }
  .img { background: #f0f0f0; height: 200px; border-radius: 8px; display: grid; place-items: center; font-size: 40px; }
  h2 { font-size: 18px; margin: 12px 0 4px; }
  .price { color: #c00; font-size: 20px; font-weight: bold; }
  .opt { display: inline-block; border: 1px solid #ccc; border-radius: 20px; padding: 6px 14px; margin: 4px 6px 4px 0; font-size: 14px; }
  .box { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin: 12px 0; }
  button { width: 100%; padding: 12px; background: #c00; color: #fff; border: none; border-radius: 8px; font-size: 15px; }
</style>
</head>
<body>
  <div class="bar"><h1>商品详情</h1><span>🛒</span></div>
  <main>
    <div class="img">🎧</div>
    <h2>无线降噪耳机</h2>
    <p class="price">¥899</p>
    <p style="color:#888;font-size:14px;">限时立减 ¥400</p>
    <div>
      <span class="opt">曜石黑</span><span class="opt">珍珠白</span><span class="opt">雾霾蓝</span>
    </div>
    <div class="box">
      <p>合计 ¥899（含优惠）</p>
      <button type="button">去结算</button>
    </div>
  </main>
</body>
</html>
