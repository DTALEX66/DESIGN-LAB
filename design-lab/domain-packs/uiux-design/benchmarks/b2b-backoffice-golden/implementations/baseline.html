<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营工作台 — Baseline</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #222; }
  .bar { padding: 10px 14px; border-bottom: 1px solid #eee; font-weight: bold; }
  main { padding: 14px; max-width: 1200px; margin: 0 auto; }
  .stats { display: flex; gap: 10px; margin: 12px 0; }
  .stat { flex: 1; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #eee; padding: 8px; text-align: left; }
  button { border: 1px solid #ccc; background: #fff; border-radius: 4px; padding: 6px 10px; margin: 2px; }
</style>
</head>
<body>
  <div class="bar">运营工作台</div>
  <main>
    <div class="stats">
      <div class="stat"><b>128</b><br><small>待处理</small></div>
      <div class="stat"><b>86</b><br><small>今日完成</small></div>
    </div>
    <table>
      <tr><th>工单号</th><th>客户</th><th>状态</th><th>操作</th></tr>
      <tr><td>WD-1012</td><td>华东供应链</td><td>待处理</td><td><button>查看</button></td></tr>
      <tr><td>WD-1011</td><td>华南零售</td><td>已完成</td><td><button>查看</button></td></tr>
    </table>
  </main>
</body>
</html>
