<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 — Baseline</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #222; }
  .bar { padding: 10px 14px; border-bottom: 1px solid #eee; font-weight: bold; }
  main { padding: 14px; max-width: 640px; margin: 0 auto; }
  .group { margin: 14px 0; }
  .group b { display: block; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid #f0f0f0; }
  input[type="range"] { flex: 1; margin-left: 10px; }
  button { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 8px 12px; margin: 4px 4px 0 0; }
</style>
</head>
<body>
  <div class="bar">设置</div>
  <main>
    <div class="group">
      <b>外观</b>
      <div class="row"><span>深色模式</span><input type="checkbox"></div>
      <div class="row"><span>字体大小</span><input type="range" value="50"></div>
      <div class="row"><span>高对比度</span><input type="checkbox"></div>
    </div>
    <div class="group">
      <b>分组</b>
      <div><button type="button">通知</button><button type="button">隐私</button><button type="button">无障碍</button><button type="button">关于</button></div>
    </div>
  </main>
</body>
</html>
